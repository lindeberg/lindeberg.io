<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Black hole</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />

    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" href="assets/images/stars.webp" as="image" type="image/webp" />
    <link rel="preload" href="assets/images/twinkling.webp" as="image" type="image/webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png" />
  </head>
  <body>
    <div class="background-container">
      <div class="stars"></div>
      <div class="twinkling"></div>
    </div>
    <main>
      <canvas id="toy"></canvas>
      <p class="hint">Move the mouse. Click and hold to feed the black hole.</p>
    </main>
    <script src="toy.js" defer></script>
  </body>
</html>
